<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Test Site — Cross-Origin Widget Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f1f5f9;
      color: #0f172a;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
      font-size: 1.75rem;
      color: #1e293b;
    }
    p {
      color: #64748b;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Simulated External Client Site (e.g. port 5500)</span>
    <h1>Welcome to Customer's Third-Party Website</h1>
    <p>
      This page simulates a customer's website hosting the FlyRank embed script. Submissions from this page test cross-origin requests, CORS headers, honeypot trapping, and dynamic form rendering.
    </p>

    <!-- FlyRank Embed Snippet (User A's Newsletter Signup Widget) -->
    <script id="flyrank-script" src="http://localhost:3000/widget.js?id=aaaa1111-aaaa-4aaa-8aaa-aaaaaaaaaaaa"></script>
  </div>
</body>
</html>
