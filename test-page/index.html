<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme Corp — Modern CRM</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --brand-primary: #3b82f6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: white;
      padding: 16px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    }
    .logo {
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--brand-primary);
      letter-spacing: -0.05em;
    }
    nav a {
      margin-left: 24px;
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      transition: color 0.2s;
    }
    nav a:hover {
      color: var(--text-main);
    }
    .hero {
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(to bottom, #ffffff, #f8fafc);
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin: 0 0 20px 0;
      color: #0f172a;
    }
    .hero p {
      font-size: 1.25rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 40px 20px 80px 20px;
    }
    .widget-container {
      width: 100%;
      max-width: 440px;
    }
    footer {
      text-align: center;
      padding: 32px 20px;
      color: var(--text-muted);
      font-size: 0.875rem;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">ACME CRM</div>
    <nav>
      <a href="#">Features</a>
      <a href="#">Pricing</a>
      <a href="#">Company</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Supercharge Your Sales</h1>
    <p>Acme CRM helps you close deals faster. Join our waitlist below to get early access to our exclusive beta.</p>
  </section>

  <main class="main-content">
    <div class="widget-container">
      <!-- FlyRank Embed Snippet (User A's Widget) -->
      <script id="flyrank-script" src="http://localhost:3000/widget.js?id=aaaa1111-aaaa-4aaa-8aaa-aaaaaaaaaaaa&v=2"></script>
    </div>
  </main>

  <footer>
    &copy; 2026 Acme Corp. Simulated Customer Environment (port 5500).
  </footer>
</body>
</html>
