version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: flyrank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: flyrank_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flyrank_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FlyRank API Backend
  api:
    build: .
    container_name: flyrank-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/flyrank_db
      DB_SSL: "false"
      JWT_SECRET: b7601154e7a3089af8af11b21e345e4efaf16eb6075dc082b3ab82562bd5f2c0
      BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    command: >
      sh -c "npm run migrate && npm run seed && npm start"

volumes:
  pgdata:
